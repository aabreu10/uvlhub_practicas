name: Deploy to Render

on:
  push:
    tags:
      - 'v*' 

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Run all tests
        run: |
          # Reemplaza esto con el comando real de tus pruebas (ej. npm test, pytest, etc.)
          echo "Ejecutando todas las pruebas..."

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Deploy to Render
        env:
          deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl "$deploy_url"